<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <div class="max-w-3xl mx-auto px-4 py-12">
        <div class="flex items-center gap-4 mb-10">
            <div class="bg-emerald-500/10 p-3 rounded-2xl border border-emerald-500/20 text-emerald-400 text-3xl">
                <i class="fa-solid fa-cubes"></i>
            </div>
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">
                    Task Tracker Pro
                </h1>
                <p class="text-slate-400 text-sm mt-1">Full-Stack додаток під керуванням Docker Compose</p>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl mb-8">
            <h2 class="text-lg font-semibold text-slate-200 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-plus text-emerald-400 text-sm"></i> Створити нове завдання
            </h2>
            <div class="flex flex-col sm:flex-row gap-3">
                <input id="taskTitle" type="text" placeholder="Назва завдання (напр., Написати звіт)..." 
                       class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition-all">
                <button onclick="addTask()" class="bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-slate-950 font-bold px-6 py-3 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/10">
                    <i class="fa-solid fa-check"></i> Додати
                </button>
            </div>
        </div>

        <div class="space-y-4">
            <div class="flex justify-between items-center px-2">
                <h3 class="text-sm font-semibold tracking-wider text-slate-400 uppercase">Поточні завдання</h3>
                <span id="taskCounter" class="bg-slate-800 text-slate-400 text-xs px-2.5 py-1 rounded-full font-mono">0</span>
            </div>
            <div id="taskList" class="space-y-3">
                </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/tasks';

        // 📥 Функція отримання всіх завдань з Backend API
        async function fetchTasks() {
            try {
                const res = await fetch(API_URL);
                const tasks = await res.json();
                
                document.getElementById('taskCounter').innerText = tasks.length;
                const list = document.getElementById('taskList');
                
                if (tasks.length === 0) {
                    list.innerHTML = `
                        <div class="text-center py-12 bg-slate-900/50 border border-slate-800 border-dashed rounded-2xl text-slate-500">
                            <i class="fa-regular fa-folder-open text-3xl mb-3 block"></i>
                            <p>Список завдань порожній. Додайте перше завдання вище!</p>
                        </div>`;
                    return;
                }

                list.innerHTML = tasks.map(t => `
                    <div class="bg-slate-900 border border-slate-800/80 hover:border-slate-700/50 p-4 rounded-xl flex justify-between items-center gap-4 transition-all group border-l-4 ${t.done ? 'border-l-emerald-500/70' : 'border-l-amber-500/70'}">
                        <div class="flex-1 min-w-0">
                            <h4 class="font-medium text-slate-200 ${t.done ? 'line-through text-slate-500' : ''} truncate">${t.title}</h4>
                            <p class="text-xs text-slate-500 mt-1 flex items-center gap-1.5">
                                <i class="fa-regular fa-clock"></i> ${new Date(t.created_at).toLocaleString()}
                            </p>
                        </div>
                        <div class="flex items-center gap-2 opacity-80 group-hover:opacity-100 transition-all">
                            <button onclick="toggleTask(${t.id}, ${t.done})" class="p-2 text-slate-400 hover:text-emerald-400 transition-colors">
                                <i class="${t.done ? 'fa-solid fa-rotate-left' : 'fa-solid fa-square-check text-lg'}"></i>
                            </button>
                            <button onclick="deleteTask(${t.id})" class="p-2 text-slate-400 hover:text-rose-400 transition-colors">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('taskList').innerHTML = `
                    <div class="bg-rose-500/10 border border-rose-500/20 text-rose-400 p-4 rounded-xl text-sm">
                        Помилка зв'язку з API-сервером. Перевірте, чи запущено контейнер backend.
                    </div>`;
            }
        }

        // 📤 Функція надсилання нового завдання
        async function addTask() {
            const input = document.getElementById('taskTitle');
            const title = input.value.trim();
            if (!title) return;

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title })
            });
            input.value = '';
            fetchTasks();
        }

        // ✏️ Функція зміни статусу завдання (Виконано / Повернути)
        async function toggleTask(id, currentStatus) {
            await fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ done: !currentStatus })
            });
            fetchTasks();
        }

        // ❌ Функція видалення завдання
        async function deleteTask(id) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchTasks();
        }

        // Початкове завантаження при відкритті сторінки
        fetchTasks();
    </script>
</body>
</html>
